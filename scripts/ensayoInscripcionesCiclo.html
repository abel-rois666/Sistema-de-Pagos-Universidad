<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ensayo local · Inscripciones ficticias</title></head><body><div style="padding:12px;background:#ffe1a0;font:13px sans-serif">ENSAYO LOCAL · DATOS FICTICIOS · RED EXTERNA BLOQUEADA <button onclick="document.documentElement.classList.toggle('dark');document.body.style.background=document.documentElement.classList.contains('dark')?'#030712':'#f9fafb'">Cambiar tema</button></div><div id="root"></div><script type="module">
const originalFetch=window.fetch.bind(window),cuat='33333333-3333-4333-8333-333333333333',sem='44444444-4444-4444-8444-444444444444';
let filas=Array.from({length:32},(_,n)=>({alumno_programa_id:'aaaaaaaa-aaaa-4aaa-8aaa-'+String(n+1).padStart(12,'0'),alumno_id:'alumno-ficticio-'+n,matricula:'PRUEBA-'+String(n+1).padStart(3,'0'),nombre:'Persona ficticia '+String(n+1).padStart(2,'0'),programa:'LD · Plan ficticio',plan_id:'22222222-2222-4222-8222-222222222222',tipo_periodo:'CUATRIMESTRAL',modalidad:'ESCOLARIZADA',grado_sugerido:'2',total_periodos:10,estatus_programa:'ACTIVO',historico:false,compatible:true,grupos:n===1?['G-FICTICIO']:[],fuentes:n===1?['Grupo']:[],inscripcion:n===0?{id:'11111111-1111-4111-8111-111111111111',alumno_programa_id:'aaaaaaaa-aaaa-4aaa-8aaa-000000000001',ciclo_id:cuat,revision:1,estado:'CONFIRMADA',desde:'2026-09-01',hasta:null,grado_personal:'2',tipo_ingreso:'REINGRESO',fecha_primer_ingreso:null,evidencia:'Ficha ficticia de reinscripción',motivo:'Confirmación ficticia',procedencia:'CONTROL_ESCOLAR',actualizado_en:'2026-10-27T00:00:00Z'}:null}));
let historial=[],integrar=false,preparaciones=[],contextos=[],bitacoraPreparaciones=[];
const ciclosEnsayo=[{id:sem,nombre:'2027-1',tipo_periodo:'Semestral',fecha_inicio:'2026-09-25',activo:false},{id:cuat,nombre:'2027-1',tipo_periodo:'Cuatrimestral',fecha_inicio:'2026-10-21',activo:true},{id:'55555555-5555-4555-8555-555555555555',nombre:'2026-3',tipo_periodo:'Cuatrimestral',fecha_inicio:'2026-06-25',activo:false},{id:'66666666-6666-4666-8666-666666666666',nombre:'2025-1',tipo_periodo:'Cuatrimestral',fecha_inicio:'2024-10-01',activo:false}];
function trayectoria(c){const n=filas.indexOf(c);return {alumno_programa_id:c.alumno_programa_id,alumno_id:c.alumno_id,plan_id:c.plan_id,modelo:'RIGIDO',huella:'ficticia-'+c.alumno_programa_id,ciclos:[...(c.inscripcion||[1,2].includes(n)?[{...ciclosEnsayo[1],materias:[1,2].includes(n)?[{id:'materia-destino-ficticia',nombre:'Materia ficticia del destino',periodo:3,registros:1}]:[],inscripcion:c.inscripcion}]:[]),...(n<4?[{...ciclosEnsayo[2],materias:[{id:'materia-ficticia',nombre:'Materia ficticia',periodo:2,registros:1}],inscripcion:{id:'origen-ficticio',revision:1,grado_personal:'2',estado:'CONFIRMADA'}},{...ciclosEnsayo[3],materias:[{id:'materia-ingreso-ficticia',nombre:'Materia ficticia de primer ciclo',periodo:1,registros:1}],inscripcion:null}]:[])]};}
function contextoFicticio(c,f){return {origen:f.referencia?'REVISION_HISTORIAL':'MANUAL',historial:trayectoria(c),referencia:f.referencia,desde:f.referencia?.aplicar_desde?{metodo:'INICIO_HISTORICO_CON_CALIFICACIONES',ciclo_id:f.referencia?.ciclo_desde_id,ciclo_destino_id:cuat,fecha:f.desde,aproximado:true}:'MANUAL'};}
function guardarFicticio(c,f,ciclo){const nueva={...f,id:c.inscripcion?.id||crypto.randomUUID(),ciclo_id:ciclo,revision:(c.inscripcion?.revision||0)+1,hasta:f.hasta||null,procedencia:'CONTROL_ESCOLAR',actualizado_en:new Date().toISOString()};historial.push({id:crypto.randomUUID(),creado_en:nueva.actualizado_en,motivo:f.motivo,antes:c.inscripcion,despues:nueva});return {...c,inscripcion:nueva};}
window.fetch=async(input,init)=>{
 const url=new URL(typeof input==='string'?input:input.url||String(input),location.href);
 if(url.origin===location.origin)return originalFetch(input,init);
 const body=init?.body?JSON.parse(String(init.body)):{},rpc=url.pathname.split('/').pop();let data=[];
 if(rpc==='ic_consultar')data=body.p_ciclo===cuat?filas:[];
 else if(rpc==='ic_configuracion')data={version:3,integrar_promocion:integrar,puente_911:true,preparaciones:true,propuesta_fecha_historial:!new URL(location.href).searchParams.has('sin-fecha-propuesta'),propuesta_fecha_inscripcion:!new URL(location.href).searchParams.has('sin-fecha-propuesta')};
 else if(rpc==='ic_trayectorias')data=filas.filter(c=>body.p_programas.includes(c.alumno_programa_id)).map(trayectoria);
 else if(rpc==='ic_integrar_promocion')integrar=body.p_activar;
 else if(rpc==='ic_guardar_lote'||rpc==='ic_guardar_revision'){
  for(const f of body.p_filas){const c=filas.find(c=>c.alumno_programa_id===f.alumno_programa_id);if(f.revision!==(c.inscripcion?.revision||0))return new Response(JSON.stringify({message:'Otra sesión cambió la inscripción. Recarga antes de guardar'}),{status:400,headers:{'content-type':'application/json'}});}
  for(const f of body.p_filas)filas=filas.map(c=>{if(c.alumno_programa_id!==f.alumno_programa_id)return c;const salida=guardarFicticio(c,f,body.p_ciclo);if(rpc==='ic_guardar_revision')contextos.push({inscripcion_id:salida.inscripcion.id,revision:salida.inscripcion.revision,ciclo_origen_id:f.ciclo_origen_id||null,contexto:contextoFicticio(c,f)});return salida;});data=body.p_filas.length;
 }else if(rpc==='ic_preparar_lote'){
  for(const f of body.p_filas){const anterior=preparaciones.find(p=>p.id===f.preparacion_id);if((anterior?.revision||0)!==f.preparacion_revision)return new Response(JSON.stringify({message:'La preparación cambió; recarga antes de editar'}),{status:400,headers:{'content-type':'application/json'}});}
  for(const f of body.p_filas){const antes=preparaciones.find(p=>p.id===f.preparacion_id);const nueva={id:f.preparacion_id,alumno_programa_id:f.alumno_programa_id,plan_id:f.plan_id,ciclo_id:body.p_ciclo,ciclo_origen_id:f.ciclo_origen_id,estado:'PENDIENTE',revision:(antes?.revision||0)+1,datos:f,referencia:f.referencia,contexto:contextoFicticio(filas.find(c=>c.alumno_programa_id===f.alumno_programa_id),f),inscripcion_esperada_id:f.inscripcion_id,inscripcion_esperada_revision:f.revision,actualizado_en:new Date().toISOString()};preparaciones=preparaciones.filter(p=>p.id!==nueva.id).concat(nueva);bitacoraPreparaciones.push({id:crypto.randomUUID(),creado_en:nueva.actualizado_en,motivo:f.motivo,antes,despues:nueva});}data=body.p_filas.length;
 }else if(rpc==='ic_confirmar_lote_preparado'){
  for(const f of body.p_fuentes){const p=preparaciones.find(p=>p.id===f.id);if(!p||p.revision!==f.revision)return new Response(JSON.stringify({message:'Preparación obsoleta'}),{status:400,headers:{'content-type':'application/json'}});}
  for(const f of body.p_fuentes){const p=preparaciones.find(p=>p.id===f.id),antes={...p};filas=filas.map(c=>{if(c.alumno_programa_id!==p.alumno_programa_id)return c;const salida=guardarFicticio(c,p.datos,p.ciclo_id);contextos.push({inscripcion_id:salida.inscripcion.id,revision:salida.inscripcion.revision,ciclo_origen_id:p.ciclo_origen_id,contexto:p.contexto});return salida;});p.estado='CONFIRMADA';p.revision++;bitacoraPreparaciones.push({id:crypto.randomUUID(),creado_en:new Date().toISOString(),motivo:'Confirmación ficticia',antes,despues:{...p}});}data=body.p_fuentes.length;
 }else if(rpc==='ic_cancelar_preparacion'){const p=preparaciones.find(p=>p.id===body.p_id),antes={...p};p.estado='CANCELADA';p.revision++;bitacoraPreparaciones.push({id:crypto.randomUUID(),creado_en:new Date().toISOString(),motivo:body.p_motivo,antes,despues:{...p}});data=null;
 }else if(rpc==='inscripciones_ciclo_historial')data=historial;
 else if(rpc==='inscripciones_ciclo_preparaciones')data=preparaciones.filter(p=>url.searchParams.get('ciclo_id')==='eq.'+p.ciclo_id);
 else if(rpc==='inscripciones_ciclo_contextos')data=contextos;
 else if(rpc==='inscripciones_ciclo_preparaciones_historial')data=bitacoraPreparaciones;
 else if(rpc==='ic_acreditar_911')data={creadas:body.p_fuentes.length,conservadas:0};
 else if(rpc==='inscripciones_academicas')data=filas.slice(0,2).map((c,n)=>({id:'nota-ficticia-'+n,alumno_id:c.alumno_id,ciclo_id:ciclosEnsayo[2].id,asignatura_id:'materia-ficticia',asignaturas:{id:'materia-ficticia',nombre:'Materia ficticia',plan_id:c.plan_id,numero_periodo:1}}));
 else if(rpc==='inscripciones_ciclo')data=filas.filter(c=>c.inscripcion).map(c=>c.inscripcion);
 else if(rpc==='planes_estudio')data=[{id:filas[0].plan_id,modelo:'RIGIDO'}];
 else if(rpc==='alumno_programas')data=filas.map(c=>({id:c.alumno_programa_id,alumno_id:c.alumno_id,plan_id:c.plan_id}));
 else if(rpc==='ciclos_escolares')data=ciclosEnsayo;
 return new Response(JSON.stringify(data),{status:200,headers:{'content-type':'application/json','content-range':'0-31/32'}});
};
const React=await import('react'),{createRoot}=await import('react-dom/client'),{Toaster}=await import('react-hot-toast'),{MemoryRouter}=await import('react-router-dom');
await import('/src/index.css');const {supabase}=await import('/src/lib/supabase.ts');

supabase.channel=()=>({on(){return this},subscribe(){return this}});supabase.removeChannel=async()=> 'ok';
const {useAppStore}=await import('/src/store/useAppStore.ts');
useAppStore.setState({currentUser:{id:'usuario-ficticio',username:'ENSAYO',rol:'ADMINISTRADOR'},activeCicloId:cuat,ciclos:ciclosEnsayo});
const rolEnsayo=document.createElement('button');rolEnsayo.textContent='Cambiar rol de ensayo';rolEnsayo.onclick=()=>{const u=useAppStore.getState().currentUser;useAppStore.setState({currentUser:{...u,rol:u.rol==='ADMINISTRADOR'?'COORDINADOR CONTROL ESCOLAR':'ADMINISTRADOR'}});};document.body.firstElementChild.append(rolEnsayo);
const {default:Modulo}=await import('/src/components/inscripciones/InscripcionesCiclo.tsx');
createRoot(document.getElementById('root')).render(React.createElement(MemoryRouter,null,React.createElement(React.Fragment,null,React.createElement(Modulo),React.createElement(Toaster))));
</script></body></html>
