const original=window.fetch.bind(window);let filas=Array.from({length:56},(_,i)=>({id:`55555555-5555-4555-8555-${String(i+1).padStart(12,'0')}`,alumnoId:`alumno-${i}`,nombre:`PERSONA FICTICIA ${String(i+1).padStart(2,'0')}`,matricula:`PRUEBA-${i+1}`,programaId:`programa-${i}`,programa:'Derecho · 2017_LD · PLAN_2017',elegible:i%5!==0,motivo:i%5===0?'Varios programas, incluidos históricos: revisar individualmente':'',pago:'COMPLETADO',tramite:'En preparación',huella:'a'.repeat(32)}));

if(url.pathname.endsWith('certificacion_lote_preview_v2')){const buscadas=filas.filter(f=>(!body.p_vista||body.p_vista==='todos'||(body.p_vista==='unico'?f.cantidadProgramas===1:f.cantidadProgramas>1))).filter(f=>(f.nombre+' '+f.matricula).toLowerCase().includes((body.p_busqueda||'').toLowerCase()));data={total:buscadas.length,filas:buscadas.slice(body.p_desde,body.p_desde+25)};}
